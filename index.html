<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161A3A">
<title>Δεν είμαι! — Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#161A3A;--panel:#20265A;--panel2:#272E6B;--ink:#10143A;--line:#343C82;
  --bulb:#FFC94A;--bulb-deep:#E9A51C;--glow:rgba(255,201,74,.5);
  --tomato:#EF5A3C;--olive:#7FBF6A;--paper:#F6F0E1;--paper-ink:#2A2440;
  --txt:#F3F1FA;--mut:#AEB3D9;
  --display:"Comfortaa",ui-rounded,system-ui,sans-serif;
  --body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:400 15px/1.5 var(--body);color:var(--txt);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(120% 60% at 50% -10%,#2B3283 0%,rgba(43,50,131,0) 60%),var(--night) fixed}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,.big,.word,.timer{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.25}
h3{font-size:17px;line-height:1.3;color:var(--txt)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mut{color:var(--mut);font-size:14px;line-height:1.5}
.center{text-align:center}
.big{font-size:28px;line-height:1.2;text-align:center}
:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}

/* ---- the light-bulb letters (the one bold thing) ---- */
.bulbs{position:relative;display:flex;justify-content:center;gap:clamp(4px,1.6vw,10px);padding:10px 0 22px;margin:0 auto}
.bulbs .wire{position:absolute;left:-4%;right:-4%;top:0;width:108%;height:34px;overflow:visible}
.bulbs .wire path{fill:none;stroke:#0B0E2A;stroke-width:1.6;vector-effect:non-scaling-stroke}
.bulbs span{--s:clamp(44px,12vw,56px);position:relative;display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;
  transform:translateY(calc(var(--y) * 14px));font:700 calc(var(--s)*.5)/1 var(--display);color:#3A2600;
  background:radial-gradient(circle at 34% 28%,#FFF6CF 0 12%,#FFD76E 38%,var(--bulb) 60%,var(--bulb-deep) 100%);
  box-shadow:0 0 22px var(--glow),0 0 2px rgba(255,255,255,.8) inset}
.bulbs span::before{content:"";position:absolute;top:-9px;left:50%;width:12px;height:10px;margin-left:-6px;border-radius:3px 3px 2px 2px;background:#0B0E2A}
.bulbs.big span{--s:clamp(46px,13.5vw,62px)}
.bulbs.anim span{animation:light .5s ease-out both;animation-delay:calc(var(--i) * 140ms)}
@keyframes light{0%{background:#3A3F6E;box-shadow:none;color:#5C6197}60%{box-shadow:0 0 34px rgba(255,201,74,.9)}100%{}}
.hero{text-align:center;padding:4px 0 2px}
.hero .sub{color:var(--mut);font-size:14.5px;max-width:30ch;margin:0 auto}
.codebox .bulbs{margin:2px auto 8px}

/* ---- panels ---- */
.box{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px}
.box h3+p{margin-top:4px}
.demo-box{background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,rgba(255,201,74,.55),rgba(255,201,74,.05)) border-box;border:1.5px dashed rgba(255,201,74,.45)}
.note{background:rgba(255,201,74,.1);border:1px solid rgba(255,201,74,.3);color:#FFE6A6;border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.45}
.lbl{font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.err{color:#FF9C86;font-size:14px;text-align:center;min-height:18px}
.err:empty{min-height:0}

/* ---- top bar ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.top>.mut{font-weight:600;color:var(--txt);font-family:var(--display);font-size:15px}
.x{background:transparent;border:1.5px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.codepill{border-radius:999px;padding:5px 10px;font:700 13px var(--display);letter-spacing:.12em;background:var(--bulb);color:#3A2600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}

/* ---- buttons ---- */
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 18px;font:700 16px var(--display);cursor:pointer;
  background:var(--bulb);color:#3A2600;box-shadow:0 4px 0 var(--bulb-deep),0 8px 24px rgba(255,201,74,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bulb-deep)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sec{background:transparent;color:var(--txt);border:1.5px solid var(--line);box-shadow:none}
.btn.sec:active{background:rgba(255,255,255,.05)}
.btn.sm{padding:11px 16px;font-size:14px;width:auto;display:inline-block}
.btn+.btn{margin-top:-2px}

/* ---- inputs ---- */
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--ink);color:var(--txt);font:500 17px var(--body);outline:none}
input:focus,select:focus{border-color:var(--bulb)}
input::placeholder{color:#6B71A8}
#code{font-family:var(--display)}
.seg{display:flex;background:var(--ink);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 6px;border-radius:999px;font:700 14px var(--body);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:0 0 0 1.5px var(--bulb) inset}
.seg.lang{width:100%;max-width:300px;margin:0 auto}

/* ---- players ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.chip.off{opacity:.45}
.chip.out{opacity:.35;text-decoration:line-through}
.av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font:700 13px var(--display);color:#fff;background:hsl(var(--h) 55% 48%);flex:none;text-decoration:none}
.crown{font-style:normal;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#5B608F;display:inline-block}
.dot.on{background:var(--olive);box-shadow:0 0 6px var(--olive)}

/* ---- game tickets ---- */
.ticket{display:flex;align-items:stretch;width:100%;text-align:left;border:0;cursor:pointer;color:var(--paper-ink);background:var(--paper);border-radius:16px;font:inherit;
  -webkit-mask:radial-gradient(circle 9px at 76px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 76px 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at 76px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 9px at 76px 100%,#0000 98%,#000) bottom/100% 51% no-repeat;transition:transform .12s}
.ticket:active{transform:scale(.985)}
.ticket .stub{flex:none;width:76px;display:grid;place-items:center;font-size:34px;background:var(--bulb);border-right:2px dashed rgba(42,36,64,.35)}
.ticket.red .stub{background:var(--tomato)}
.ticket .meta{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.ticket b{font:700 19px var(--display)}
.ticket .meta span{font-size:14px;line-height:1.4;color:#4A4462}
.ticket em{font-style:normal;font-weight:700;font-size:13px;color:#7A3A12;margin-top:4px}
.ticket.red em{color:#A3301A}
.settings{margin-top:-4px}
.settings .lbl:first-child{margin-top:0}

/* ---- Ballpark ---- */
.q{font:700 20px/1.35 var(--display);text-align:center;text-wrap:balance}
.boosts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boost{background:var(--ink);border:1.5px solid transparent;border-radius:16px;padding:10px 4px;color:var(--txt);text-align:center;cursor:pointer;font:600 13px var(--body)}
.boost span{display:block;font-size:24px;line-height:1.3}
.boost.on{border-color:var(--bulb);background:#3A3420}
.boost:disabled{opacity:.3}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pick button{background:var(--ink);border:1.5px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font:600 15px var(--body);cursor:pointer}
.pick button.on{border-color:var(--bulb);background:#3A3420}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{color:var(--bulb)}
.good{color:var(--olive);font-weight:800}
.badc{color:#FF9C86}
.bar{height:10px;background:var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bulb);border-radius:999px;box-shadow:0 0 10px var(--glow)}
.confetti{font-size:56px;text-align:center}

/* ---- Impostor ---- */
.reveal{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;user-select:none;-webkit-user-select:none;cursor:pointer}
.reveal.back{background:repeating-linear-gradient(45deg,#232A63 0 14px,#1D2357 14px 28px);border:2px solid var(--line)}
.reveal.imp{background:radial-gradient(circle at 50% 0,#FF7A5C,var(--tomato) 45%,#9E2A16);color:#fff}
.reveal.cit{background:radial-gradient(circle at 50% 0,#A6DB8F,var(--olive) 45%,#3F7A3A);color:#0F2410}
.reveal.flip{animation:flip .45s ease-out}
@keyframes flip{from{transform:perspective(700px) rotateY(90deg);opacity:.4}to{transform:none;opacity:1}}
.word{font-size:34px;line-height:1.15}
.timer{font-size:60px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.low{color:var(--tomato)}
.tbar{height:8px;border-radius:999px;background:var(--ink);overflow:hidden;margin:10px 0 4px}
.tbar i{display:block;height:100%;background:var(--bulb);transition:width .5s linear}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel);color:var(--txt);font:600 16px var(--body);cursor:pointer;text-align:left}
.vote button.on{border-color:var(--tomato);background:#3B1F3A}
.vote button.out{opacity:.3;text-decoration:line-through;pointer-events:none}
ul.rules{padding-left:18px;font-size:14.5px;line-height:1.6}
ul.rules li{margin:5px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;text-align:center;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn[data-a="submit-range"]{margin-top:14px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ans{font:700 46px/1.1 var(--display);text-align:center;color:var(--bulb);text-shadow:0 0 24px var(--glow);margin-top:8px;font-variant-numeric:tabular-nums}
.word.glow{color:var(--bulb);text-shadow:0 0 20px var(--glow)}
.reveal .rs{font-size:15px;font-weight:600;opacity:.85}
.reveal.cit .rs{color:#173A17}
.reveal.imp .rs{color:#FFE9E2}
.av.bot{background:#3A4185;font-size:15px}
.chips.cen{justify-content:center}
.chip .tick{font-style:normal;font-weight:800;color:var(--mut)}
.chip.yes .tick{color:var(--olive)}
.chip.wait{opacity:.6}
.rulesrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:2px}

/* easter egg */
.bulbs span[data-a]{cursor:pointer}
.bulbs span.tapped{filter:brightness(1.25) saturate(1.2)}
.bulbs.mid{padding-top:6px}
.bulbs.mid span{--s:clamp(34px,10.4vw,48px)}
.egg{cursor:pointer}
.egg .bulbs.anim span{animation:flicker .9s steps(1,end) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes flicker{0%{background:#3A3F6E;box-shadow:none;color:#5C6197}20%{background:radial-gradient(circle at 34% 28%,#FFF6CF 0 12%,#FFD76E 38%,var(--bulb) 60%,var(--bulb-deep) 100%);box-shadow:0 0 30px rgba(255,201,74,.9);color:#3A2600}35%{background:#3A3F6E;box-shadow:none;color:#5C6197}55%{}100%{}}

.name .bulbs+.bulbs{padding-top:4px;margin-top:-6px}

/* removing players + join requests */
.kickbtn{border:0;background:rgba(239,90,60,.18);color:#FFB3A3;border-radius:999px;min-width:24px;height:24px;padding:0 7px;font:700 12px var(--body);cursor:pointer;margin-left:2px}
.kickbtn.sure{background:var(--tomato);color:#fff}
.chip.arm{box-shadow:0 0 0 1.5px var(--tomato) inset}
.x.on{border-color:var(--bulb);color:var(--bulb)}
.playerspanel{margin-top:-2px}
.joinreq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:10px 12px 10px 14px;font-size:14.5px;animation:pop .25s ease-out}
.joinreq .x{border-color:rgba(42,36,64,.3);color:var(--paper-ink)}
.joinreq .btn.sm{box-shadow:0 3px 0 var(--bulb-deep)}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.x,.btn.sm,.kickbtn{white-space:nowrap}
.joinreq>span{flex:1 1 160px}

.kickbtn.ok{background:rgba(127,191,106,.22);color:#BDEBAA}
.chip.wait{box-shadow:0 0 0 1.5px rgba(255,201,74,.45) inset}
.chip .tag{font-style:normal;font-weight:600;font-size:12px;color:var(--bulb)}
</style>
</head>

<script>
"use strict";

/* ---------------- P2P transport ----------------
   The host's phone keeps the room's whole database in memory (same layout
   as before) and enforces the privacy rules itself. Players connect to the
   host over WebRTC (PeerJS) and read/write through a tiny request protocol.
   PeerJS's matchmaking server only introduces phones; game data goes
   phone-to-phone. */
const APP_VERSION='2.5.0';
const PROTO=5;               // bump when the host<->player messages change
const hostId=code=>'parea-party-gr-'+code.toLowerCase();
function norm(v){
  if(v===null||v===undefined)return null;
  if(Array.isArray(v)){const a=v.map(norm);return a.some(x=>x!==null)?a:null}
  if(typeof v==='object'){const o={};for(const k in v){const n=norm(v[k]);if(n!==null)o[k]=n}return Object.keys(o).length?o:null}
  if(typeof v==='number'&&!isFinite(v))return null;
  return v;
}
function makeTreeDB(store,uid){
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=p=>parts(p).reduce((o,k)=>o==null?undefined:o[k],store.tree);
  const setAt=(p,v)=>{const ks=parts(p);let o=store.tree;
    for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}
    const last=ks[ks.length-1];const n=norm(v);if(n===null)delete o[last];else o[last]=JSON.parse(JSON.stringify(n));
    store.tree=norm(store.tree)||{};};
  const mySubs=new Set();
  const fire=()=>{for(const s of mySubs){const v=norm(getAt(s.p));const j=JSON.stringify(v);if(j!==s.last){s.last=j;s.cb(v===null?null:JSON.parse(j))}}};
  const commit=()=>{store.save&&store.save();for(const f of store.fires)queueMicrotask(f)};
  store.fires=store.fires||new Set();store.fires.add(fire);
  return {uid,mode:'host',now:()=>Date.now(),
    peek:p=>norm(getAt(p)),
    get:async p=>{const v=norm(getAt(p));return v===null?null:JSON.parse(JSON.stringify(v))},
    set:async(p,v)=>{setAt(p,v);commit()},
    update:async(p,obj)=>{for(const k in obj)setAt(p+'/'+k,obj[k]);commit()},
    remove:async p=>{setAt(p,null);commit()},
    on:(p,cb)=>{const s={p,cb,last:undefined};mySubs.add(s);queueMicrotask(fire);return()=>mySubs.delete(s)},
    onDisconnectSet:()=>{},
    onConnected:cb=>{queueMicrotask(()=>cb(true));return()=>{}}};
}
let PEER_OVERRIDE=null;
function loadPeer(){
  if(PEER_OVERRIDE)return Promise.resolve(PEER_OVERRIDE);
  if(window.PAREA_PEER)return Promise.resolve(window.PAREA_PEER);
  if(window.Peer)return Promise.resolve(window.Peer);
  return new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload=()=>window.Peer?res(window.Peer):rej(new Error('PeerJS'));s.onerror=()=>rej(new Error('Δεν φορτώθηκε η βιβλιοθήκη σύνδεσης (internet;)'));
    document.head.appendChild(s)});
}
const peerOpts=()=>Object.assign({debug:0},window.PAREA_ICE?{config:{iceServers:window.PAREA_ICE}}:{});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- host side ---- */
async function hostRoomDB(code,restoreTree){
  const Peer=await loadPeer();
  const peer=await new Promise((res,rej)=>{
    const p=new Peer(hostId(code),peerOpts());let opened=false;
    p.on('open',()=>{opened=true;res(p)});
    p.on('error',e=>{if(!opened){try{p.destroy()}catch(x){}rej(e)}else console.warn('host peer',e&&e.type)});
  });
  let saveT=null;
  const store={tree:restoreTree||{},fires:new Set(),save:()=>{if(A.demo)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{sessionStorage.setItem('parea-host-tree',JSON.stringify(store.tree))}catch(e){}},300)}};
  const db=makeTreeDB(store,A.uid);db.mode='host';db.code=code;
  const clients=new Set();
  const hostUid=()=>{const m=db.peek(`rooms/${code}/meta`);return m&&m.host};
  function perm(uid,path,mode){
    const s=path.split('/').filter(Boolean);
    if(s[0]!=='rooms'||s[1]!==code||s.length<3)return false;
    if(uid===hostUid())return true;
    const seg=s[2],who=s[3];
    if(mode==='read')return seg==='meta'||seg==='players'||seg==='state'||((seg==='inputs'||seg==='secrets'||seg==='kicked')&&who===uid);
    return (seg==='players'||seg==='inputs')&&who===uid&&s.length>=4;
  }
  const send=(cl,m)=>{try{cl.conn.send(m)}catch(e){}};
  function push(cl){
    for(const[sid,s]of cl.subs){const v=db.peek(s.p);const j=JSON.stringify(v);if(j!==s.last){s.last=j;send(cl,{t:'val',sid,v})}}
  }
  async function onMsg(cl,m){
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(m.v!==PROTO){send(cl,{t:'reject',reason:'version',v:PROTO,app:APP_VERSION});setTimeout(()=>{try{cl.conn.close()}catch(e){}},800);return}
      if(typeof m.uid!=='string'||!/^[a-z0-9]{6,24}$/.test(m.uid)||m.uid===A.uid){send(cl,{t:'reject',reason:'id'});return}
      cl.uid=m.uid;clients.add(cl);cl.fire=()=>push(cl);store.fires.add(cl.fire);
      send(cl,{t:'welcome',v:PROTO,now:Date.now()});return;
    }
    if(!cl.uid)return;
    const raw=JSON.stringify(m);if(raw.length>6000){if(m.id)send(cl,{t:'res',id:m.id,ok:false,err:'too big'});return}
    if(m.t==='op'){
      let ok=true,v=null,err=null;
      try{
        if(m.op==='get'){if(!perm(cl.uid,m.p,'read'))throw new Error('denied');v=db.peek(m.p)}
        else if(m.op==='set'||m.op==='remove'){if(!perm(cl.uid,m.p,'write'))throw new Error('denied');await db.set(m.p,m.op==='remove'?null:m.v)}
        else if(m.op==='update'){const o=m.v||{};for(const k in o)if(!perm(cl.uid,m.p+'/'+k,'write'))throw new Error('denied');await db.update(m.p,o)}
        else throw new Error('bad op');
      }catch(e){ok=false;err=e.message}
      send(cl,{t:'res',id:m.id,ok,v,err});return;
    }
    if(m.t==='sub'){if(perm(cl.uid,m.p,'read')){cl.subs.set(m.sid,{p:m.p,last:undefined});push(cl)}else send(cl,{t:'val',sid:m.sid,v:null,denied:true});return}
    if(m.t==='unsub'){cl.subs.delete(m.sid);return}
    if(m.t==='ondisc'){if(perm(cl.uid,m.p,'write'))cl.disc.set(m.p,m.v);return}
  }
  peer.on('connection',conn=>{
    const cl={conn,uid:null,subs:new Map(),disc:new Map(),fire:null};
    conn.on('data',m=>onMsg(cl,m));
    const gone=()=>{if(cl.gone)return;cl.gone=true;clients.delete(cl);if(cl.fire)store.fires.delete(cl.fire);
      if(cl.uid&&!cl.kicked&&![...clients].some(c=>c.uid===cl.uid))for(const[p,v]of cl.disc)db.set(p,v)};
    conn.on('close',gone);conn.on('error',gone);
  });
  peer.on('disconnected',()=>{if(!db.closed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});
  db.close=()=>{db.closed=true;setTimeout(()=>{try{peer.destroy()}catch(e){}},500)};
  db.clientCount=()=>clients.size;
  /* remove a player: drop their seat, tell their phone, cut the line; if they come back they wait for approval */
  db.kick=async uid=>{
    await db.set(`rooms/${code}/kicked/${uid}`,true);
    for(const cl of [...clients])if(cl.uid===uid){cl.kicked=true;cl.disc.clear();send(cl,{t:'kicked'});setTimeout(()=>{try{cl.conn.close()}catch(e){}},400)}
    await db.remove(`rooms/${code}/players/${uid}`);
    await db.remove(`rooms/${code}/inputs/${uid}`);
    await db.remove(`rooms/${code}/secrets/${uid}`);
  };
  return db;
}
async function hostRoomWithRetry(code,tree,tries){
  for(let i=0;i<tries;i++){
    try{return await hostRoomDB(code,tree)}
    catch(e){if(e&&e.type==='unavailable-id'&&i<tries-1){await sleep(1500);continue}throw e}
  }
}

/* ---- player side ---- */
async function joinRoomDB(code,opt){
  const myUid=(opt&&opt.uid)||A.uid;
  const Peer=await loadPeer();
  const peer=await new Promise((res,rej)=>{const p=new Peer(undefined,peerOpts());let opened=false;
    const to=setTimeout(()=>{if(!opened){try{p.destroy()}catch(e){}rej(new Error('Δεν απαντάει ο server σύνδεσης'))}},12000);
    p.on('open',()=>{opened=true;clearTimeout(to);res(p)});
    p.on('error',e=>{if(!opened){clearTimeout(to);try{p.destroy()}catch(x){}rej(e)}});});
  const db={uid:myUid,mode:'player',code,offset:0,closed:false};
  let conn=null,ready=false,reqN=0,sidN=0,pendingConnect=null;
  const pending=new Map(),subs=new Map(),disc=new Map(),connCbs=[];
  const setReady=r=>{ready=r;connCbs.forEach(f=>{try{f(r)}catch(e){console.error(e)}})};
  function connect(){
    return new Promise((res,rej)=>{
      const c=peer.connect(hostId(code),{reliable:true,serialization:'json'});
      let done=false;const fail=e=>{if(done)return;done=true;clearTimeout(to);pendingConnect=null;try{c.close()}catch(x){}rej(e)};
      const to=setTimeout(()=>fail(new Error('timeout')),9000);
      pendingConnect=fail;
      c.on('open',()=>c.send({t:'hello',uid:myUid,v:PROTO}));
      c.on('data',m=>{
        if(!m||typeof m!=='object')return;
        if(m.t==='welcome'){
          if(!done){done=true;clearTimeout(to);pendingConnect=null}
          db.offset=m.now-Date.now();conn=c;
          for(const[sid,s]of subs){s.last=undefined;c.send({t:'sub',sid,p:s.p})}
          for(const[p,v]of disc)c.send({t:'ondisc',p,v});
          setReady(true);res();return;
        }
        if(m.t==='kicked'){db.closed=true;db.onFatal&&db.onFatal('kicked');setTimeout(()=>{try{c.close()}catch(x){}try{peer.destroy()}catch(x){}},200);return}
        if(m.t==='reject'){const e=new Error(m.reason);e.reject=m;fail(e);return}
        if(m.t==='res'){const q=pending.get(m.id);if(q){pending.delete(m.id);m.ok?q.res(m.v):q.rej(new Error(m.err||'error'))}return}
        if(m.t==='val'){const s=subs.get(m.sid);if(s)s.cb(m.v===undefined?null:m.v);return}
      });
      const onClose=()=>{
        if(!done){fail(new Error('closed'));return}
        if(conn===c){conn=null;setReady(false);for(const[,q]of pending)q.rej(new Error('offline'));pending.clear();if(!db.closed)setTimeout(retry,1500)}
      };
      c.on('close',onClose);c.on('error',onClose);
    });
  }
  let retrying=false;
  async function retry(){
    if(db.closed||ready||retrying)return;retrying=true;
    try{await connect()}catch(e){if(e.reject&&(e.reject.reason==='version'||e.reject.reason==='kicked')){db.closed=true;db.onFatal&&db.onFatal(e.reject.reason);retrying=false;return}retrying=false;setTimeout(retry,2500);return}
    retrying=false;
  }
  peer.on('error',e=>{if(e&&e.type==='peer-unavailable'&&pendingConnect)pendingConnect(Object.assign(new Error('not-found'),{notFound:true}))});
  peer.on('disconnected',()=>{if(!db.closed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});
  const req=(op,p,v)=>new Promise((res,rej)=>{
    if(!ready||!conn)return rej(new Error('Εκτός σύνδεσης — δοκίμασε ξανά'));
    const id=++reqN;pending.set(id,{res,rej});conn.send({t:'op',id,op,p,v});
    setTimeout(()=>{if(pending.has(id)){pending.delete(id);rej(new Error('timeout'))}},10000)});
  db.now=()=>Date.now()+db.offset;
  db.get=p=>req('get',p);
  db.set=(p,v)=>req('set',p,v===undefined?null:v);
  db.update=(p,v)=>req('update',p,v);
  db.remove=p=>req('remove',p);
  db.on=(p,cb)=>{const sid=++sidN;subs.set(sid,{p,cb});if(ready&&conn)conn.send({t:'sub',sid,p});
    return()=>{subs.delete(sid);if(ready&&conn)try{conn.send({t:'unsub',sid})}catch(e){}}};
  db.onDisconnectSet=(p,v)=>{disc.set(p,v);if(ready&&conn)conn.send({t:'ondisc',p,v})};
  db.onConnected=cb=>{connCbs.push(cb);queueMicrotask(()=>cb(ready));return()=>{}};
  db.close=()=>{db.closed=true;setTimeout(()=>{try{conn&&conn.close()}catch(e){}try{peer.destroy()}catch(e){}},300)};
  try{await connect()}catch(e){db.closed=true;try{peer.destroy()}catch(x){}throw e}
  return db;
}

/* ---- in-page network for "Try with bots" (no internet needed) ---- */
const DemoNet=new Map();const dLater=f=>setTimeout(f,15);
class DEm{constructor(){this.h={}}on(e,f){(this.h[e]=this.h[e]||[]).push(f)}emit(e,...a){(this.h[e]||[]).forEach(f=>{try{f(...a)}catch(x){console.error(x)}})}}
class DConn extends DEm{constructor(){super();this.other=null;this.open=false;this.closed=false}
  send(m){if(!this.open||this.closed)return;const o=this.other,j=JSON.stringify(m);dLater(()=>{if(!o.closed)o.emit('data',JSON.parse(j))})}
  close(){if(this.closed)return;this.closed=true;this.open=false;dLater(()=>this.emit('close'));const o=this.other;if(o&&!o.closed){o.closed=true;o.open=false;dLater(()=>o.emit('close'))}}}
class DemoPeer extends DEm{constructor(id){super();this.conns=[];dLater(()=>{if(id&&DemoNet.has(id)){this.emit('error',{type:'unavailable-id'});return}
  this.id=id||('d'+Math.random().toString(36).slice(2,9));DemoNet.set(this.id,this);this.emit('open',this.id)})}
  connect(id){const a=new DConn();this.conns.push(a);dLater(()=>{const t=DemoNet.get(id);if(!t){this.emit('error',{type:'peer-unavailable'});return}
    const b=new DConn();a.other=b;b.other=a;t.conns.push(b);t.emit('connection',b);dLater(()=>{a.open=b.open=true;b.emit('open');a.emit('open')})});return a}
  reconnect(){}destroy(){DemoNet.delete(this.id);this.conns.forEach(c=>c.close())}}

    const act=activeOf(s.order);

  }
  if(s.game==='imp'){

  const deck=shuffle(QA.map((_,i)=>i));

}
async function rangeNext(){

  if(qi>=deck.length){deck=shuffle(QA.map((_,i)=>i));qi=0}

function resolveRange(){
  const s=A.state,ans=A.hostdata.ans,order=arr(s.order);
  const used=JSON.parse(JSON.stringify(s.used||{}));const scores={...(s.scores||{})};
  const entries=order.map(u=>{const i=A.inputs[u];if(!i||i.round!==s.round)return null;
    const e={p:u,boost:i.boost||null,lo:i.lo,hi:i.hi,target:i.target,a:i.a,b:i.b};
    if(e.boost&&(!used[u]||used[u][e.boost]))e.boost=null;
    if(e.boost)used[u][e.boost]=true;
    return e}).filter(Boolean);
  const fin={},notes=[];
  entries.forEach(e=>{if(e.boost!=='steal'&&typeof e.lo==='number'&&typeof e.hi==='number')fin[e.p]={lo:Math.min(e.lo,e.hi),hi:Math.max(e.lo,e.hi)}});
  entries.filter(e=>e.boost==='swap').forEach(e=>{const X=fin[e.a],Y=fin[e.b];
    if(X&&Y){fin[e.a]=Y;fin[e.b]=X;notes.push({k:'swap',p:e.p,a:e.a,b:e.b})}else notes.push({k:'swapx',p:e.p})});
  const snap=JSON.parse(JSON.stringify(fin));
  entries.filter(e=>e.boost==='steal').forEach(e=>{const src=snap[e.target];if(src)fin[e.p]={...src};notes.push({k:'steal',p:e.p,a:e.target})});
  const correct=order.filter(u=>fin[u]&&fin[u].lo<=ans&&ans<=fin[u].hi);
  const minW=Math.min(...correct.map(u=>fin[u].hi-fin[u].lo));
  const rows=order.map(u=>{const e=entries.find(x=>x.p===u);const ok=correct.includes(u);
    let pts=ok?(fin[u].hi-fin[u].lo===minW?4:1):0;
    if(e&&e.boost==='double'){if(ok)notes.push({k:'double',p:u});pts*=2}
    scores[u]=(scores[u]||0)+pts;
    return {u,lo:fin[u]?fin[u].lo:null,hi:fin[u]?fin[u].hi:null,ok,pts,boost:e?e.boost:null}});
  const top=Math.max(...order.map(u=>scores[u]));const leaders=order.filter(u=>scores[u]===top);
  const winner=top>=s.target&&leaders.length===1?leaders[0]:null;
  A.db.update(P('state'),{phase:winner?'over':'reveal',reveal:{ans,q:s.q,rows,notes},scores,used,winner,submitted:null});
}

  const imps=shuffle(order).slice(0,n);const gid=Date.now();
  const secrets={};
  order.forEach(u=>{const imp=imps.includes(u);
    secrets[u]=imp?{gid,role:'imp',cat:S.hint?cat:null,partners:imps.filter(x=>x!==u).map(pname)}:{gid,role:'cit',cat,wi}});
  A.lastAct=null;
  await A.db.remove(P('inputs'));
  await A.db.set(P('secrets'),secrets);
  await A.db.set(P('hostdata'),{gid,cat,wi,imps});
  await A.db.set(P('state'),{game:'imp',phase:'roles',gid,order,alive:order,round:1,impCount:n,mins:S.mins,starter:shuffle(order)[0]});
}
function startDiscuss(){A.db.update(P('state'),{phase:'discuss',endsAt:A.db.now()+A.state.mins*60000})}
function tally(){
  const s=A.state,h=A.hostdata;const alive=arr(s.alive);const counts={};
  for(const u of alive){const i=A.inputs[u];if(i&&i.gid===s.gid&&i.vround===s.round&&i.vote&&alive.includes(i.vote))counts[i.vote]=(counts[i.vote]||0)+1}
  const max=Math.max(0,...Object.values(counts));const tops=Object.keys(counts).filter(u=>counts[u]===max);
  const base={round:s.round+1,phase:'discuss',endsAt:A.db.now()+s.mins*60000,voted:null,lastVotes:counts};
  if(!max||tops.length>1){A.db.update(P('state'),{...base,starter:shuffle(alive)[0],last:{k:'tie'}});return}
  const out=tops[0];const left=alive.filter(u=>u!==out);const imps=arr(h.imps);const wasImp=imps.includes(out);
  const impsLeft=left.filter(u=>imps.includes(u)).length,cits=left.length-impsLeft;
  if(impsLeft===0||impsLeft>=cits){
    A.db.update(P('state'),{phase:'over',alive:left,win:impsLeft===0?'cit':'imp',elim:{u:out,wasImp},reveal:{cat:h.cat,wi:h.wi,imps},lastVotes:counts,voted:null});return}
  A.db.update(P('state'),{...base,alive:left,starter:shuffle(left)[0],elim:{u:out,wasImp},last:{k:wasImp?'impOut':'citOut',u:out,n:impsLeft}});
}
const lastText=l=>!l?'':l.k==='left'?t('lLeft',esc(pname(l.u))):l.k==='tie'?t('lTie'):l.k==='impOut'?t('lImpOut',esc(pname(l.u)),l.n):t('lCitOut',esc(pname(l.u)));

function pendingJoins(){const s=A.state||{};if(!isHost())return [];
  const lobby=!s.phase||s.phase==='lobby',order=arr(s.order),dec=s.declined||{},kicked=A.kicked||{};
  return Object.entries(A.players).filter(([u,p])=>p.online&&u!==A.uid&&!dec[u]&&(kicked[u]||(!lobby&&!order.includes(u)))).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0)).map(([u])=>u)}
async function removeFromGame(u){
  const s=A.state;if(!s||!s.phase||s.phase==='lobby'||!arr(s.order).includes(u))return;
  const order=arr(s.order).filter(x=>x!==u);const upd={order,['gone/'+u]:pname(u)};
  if(s.game==='imp'&&s.phase!=='over'&&arr(s.alive).includes(u)){
    const alive=arr(s.alive).filter(x=>x!==u),h=A.hostdata||{},imps=arr(h.imps);
    const impsLeft=alive.filter(x=>imps.includes(x)).length,cits=alive.length-impsLeft;
    upd.alive=alive;
    if(s.phase!=='roles'&&(impsLeft===0||impsLeft>=cits)){Object.assign(upd,{phase:'over',win:impsLeft===0?'cit':'imp',elim:null,reveal:{cat:h.cat,wi:h.wi,imps},last:{k:'left',u},voted:null})}
    else{upd.last={k:'left',u};if(s.starter===u&&alive.length)upd.starter=shuffle(alive)[0]}
  }
  await A.db.update(P('state'),upd);
}
async function kickPlayer(u){
  if(!isHost()||u===A.uid||!A.db.kick)return;const n=pname(u);A.kickArm=null;
  await removeFromGame(u);await A.db.kick(u);
  const bot=A.bots.find(b=>b.uid===u);if(bot){A.bots=A.bots.filter(b=>b!==bot)}
  toast(t('kickedToast',n));
}
async function approvePlayer(u){
  if(!isHost()||!A.players[u])return;
  const wasRemoved=!!(A.kicked||{})[u];if(wasRemoved)await A.db.remove(P('kicked/'+u));
  const s=A.state||{};
  if(!s.phase||s.phase==='lobby'||arr(s.order).includes(u)){if(s.phase)await A.db.update(P('state'),{['declined/'+u]:null});toast(t('joinedToast',pname(u)));return}
  const upd={order:[...arr(s.order),u],['declined/'+u]:null};
  if(s.game==='range'){upd['scores/'+u]=0;upd['used/'+u]={steal:false,swap:false,double:false}}
  if(s.game==='imp'&&s.phase!=='over'){const h=A.hostdata||{};
    await A.db.set(P('secrets/'+u),{gid:s.gid,role:'cit',cat:h.cat,wi:h.wi});
    upd.alive=[...arr(s.alive),u]}
  await A.db.update(P('state'),upd);toast(t('joinedToast',pname(u)));
}
function declinePlayer(u){if(!A.state)return A.db.set(P('state'),{phase:'lobby',declined:{[u]:true}});return A.db.update(P('state'),{['declined/'+u]:true})}
function backToLobby(){A.lastAct=null;A.db.set(P('state'),{phase:'lobby'});A.db.remove(P('secrets'));A.db.remove(P('inputs'));A.db.remove(P('hostdata'))}

async function submitRange(){

  if(d.boost!=='steal'){const lo=parseFloat(String(d.lo).replace(',','.')),hi=parseFloat(String(d.hi).replace(',','.'));

}

  if(s.phase==='discuss'){
    const left=Math.max(0,Math.ceil((s.endsAt-A.db.now())/1000));
    return `${topBar(t('gImp')+' · '+t('round',s.round))}${lastBox}
    <div class="box center"><div class="mut">${t('starts')}</div><div class="big" style="margin:6px 0">${esc(pname(s.starter))}</div><div class="mut">${t('clueInfo')}</div>${aliveChips}</div>
    <div class="box"><div class="timer${left<=10?' low':''}" id="timer">${fmtT(left)}</div><div class="tbar"><i id="tbar" style="width:${Math.min(100,left/(s.mins*60)*100)}%"></i></div>
    ${host?`<div class="row" style="margin-top:8px"><button class="btn sec" data-a="add30">+30″</button><button class="btn" data-a="vote-now">${t('voteNow')}</button></div>`:''}</div>
    ${A.demo?`<div class="note">${t('demoTalk')}</div>`:''}${inGame?'':`<div class="box center mut">${t('eliminated')}</div>`}${peekBtn}`;
  }
  if(s.phase==='vote'){
    const myVote=A.myInput&&A.myInput.gid===s.gid&&A.myInput.vround===s.round?A.myInput.vote:null;
    const voted=s.voted||{};
    return `${topBar(t('voteL'))}
    <div class="box center"><h2>${t('whoImp')}</h2><div class="mut" style="margin-top:6px">${inGame?t('voteInfo'):t('eliminated')}</div></div>
    ${inGame?`<div class="vote">${arr(s.alive).filter(u=>u!==A.uid).map(u=>`<button data-a="vote" data-p="${u}" class="${myVote===u?'on':''}">${avatar(u)}<span>${esc(pname(u))}</span></button>`).join('')}</div>`:''}
    <div class="lbl center" style="margin:4px 0 -4px">${t('votedL')}</div><div class="chips cen">${arr(s.alive).map(u=>`<div class="chip${voted[u]?' yes':' wait'}">${avatar(u)}<span>${esc(pname(u))}</span><i class="tick">${voted[u]?'✓':'…'}</i></div>`).join('')}</div>
    <div class="mut center">${t('waitAll')}</div>${peekBtn}`;
  }
  if(s.phase==='over'){
    const cit=s.win==='cit',r=s.reveal||{};const votes=s.lastVotes||{};
    return `${topBar(t('endL'))}<div class="box center" style="padding:24px 16px"><div class="confetti">${cit?'🎉':'🕵️'}</div>
    <div class="big">${cit?t('citWin'):(s.impCount>1?t('impsWin'):t('impWin'))}</div>
    ${s.elim?`<div class="mut" style="margin-top:8px">${t('lastOut',esc(pname(s.elim.u)),s.elim.wasImp?t('roleImp'):t('roleCit'))}</div>`:s.last&&s.last.k==='left'?`<div class="mut" style="margin-top:8px">${lastText(s.last)}</div>`:''}</div>
    <div class="box center"><div class="mut">${t('wordWas')}</div><div class="word glow">${esc(wordText(r.cat,r.wi))}</div>
    <div class="mut">${esc(catName(r.cat))}</div>
    <div class="mut" style="margin-top:8px">${s.impCount>1?'Impostors':'Impostor'}: <b>${arr(r.imps).map(u=>esc(pname(u))).join(', ')}</b></div>
    ${Object.keys(votes).length?`<div class="mut" style="margin-top:8px">${t('votesL')}: ${Object.entries(votes).map(([u,c])=>`${esc(pname(u))} ${c}`).join(' · ')}</div>`:''}</div>
    ${host?`<button class="btn" data-a="start-imp">${t('newRound')}</button><button class="btn sec" data-a="lobby">${t('toLobby')}</button>`:`<div class="mut center">${t('hostWillRound')}</div>`}`;
  }
  return '';
}
function rulesView(g){
  return `<div class="top"><h2>${g==='range'?'🎯 '+t('gRange'):'🕵️ '+t('gImp')}</h2></div><div class="box"><ul class="rules">${g==='range'?t('rulesRange'):t('rulesImp')}</ul></div><button class="btn sec" data-a="close-rules">${t('back')}</button>`;
}
function render(){
  document.title=t('appName')+' — Party Games';
  const keep={};app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);
  const act=document.activeElement&&document.activeElement.id;
  let h;const s=A.state;
  if(A.rules)h=rulesView(A.rules);
  else if(!A.code)h=homeView();
  else if(!A.meta)h=`<div class="box center mut">${t('connecting')}</div>`;
  else if(A.waitingBack&&!isHost())h=waitingBackView();
  else if(!s||s.phase==='lobby')h=lobbyView();
  else if(!arr(s.order).includes(A.uid))h=spectatorView();
  else if(s.game==='range')h=s.phase==='answer'?rangeAnswerView(s):rangeRevealView(s);
  else if(s.game==='imp')h=impView(s);
  else h=lobbyView();
  if(A.toast)h+=`<div class="toast">${esc(A.toast)}</div>`;
  app.innerHTML=h;
  for(const id in keep){const el=document.getElementById(id);if(el)el.value=keep[id]}
  if(act){const el=document.getElementById(act);if(el)el.focus()}
}
setInterval(()=>{const el=document.getElementById('timer');if(el&&A.db&&A.state&&A.state.endsAt){const l=Math.max(0,Math.ceil((A.state.endsAt-A.db.now())/1000));el.textContent=fmtT(l);el.classList.toggle('low',l<=10);const b=document.getElementById('tbar');if(b)b.style.width=Math.min(100,l/(A.state.mins*60)*100)+'%'}},500);

/* ---------------- input ---------------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.disabled)return;
  const a=b.dataset.a,s=A.state;
  const run=p=>Promise.resolve(p).catch(err=>{console.error(err);toast(t('error')+(err.message||err))});
  switch(a){
    case'lang':if(!A.code)saveName();eggPos=0;setLang(b.dataset.v);break;
    case'create':run(createRoom());break;
    case'join':run(joinRoom());break;
    case'demo':run(startDemo());break;
    case'kick':{const u=b.dataset.p;A.kickArm=u;render();clearTimeout(A.kickT);A.kickT=setTimeout(()=>{if(A.kickArm===u){A.kickArm=null;render()}},4000);break}
    case'kick-yes':run(kickPlayer(b.dataset.p));break;
    case'players':A.showPlayers=!A.showPlayers;A.kickArm=null;render();break;
    case'approve':run(approvePlayer(b.dataset.p));break;
    case'decline':run(declinePlayer(b.dataset.p));break;
    case'bulb':{const i=+b.dataset.i;b.classList.add('tapped');
      const EO=eggOrder();if(i===EO[eggPos])eggPos++;else eggPos=(i===EO[0])?1:0;
      if(eggPos===EO.length){eggPos=0;saveName();A.egg=true;seenBulbs.delete('egg-a');seenBulbs.delete('egg-b');render();try{navigator.vibrate&&navigator.vibrate([40,40,80])}catch(e){}}
      break}
    case'egg-off':saveName();A.egg=false;eggPos=0;[...seenBulbs].filter(k=>k.startsWith('hero')).forEach(k=>seenBulbs.delete(k));render();break;
    case'leave':run(leaveRoom());break;
    case'share':shareLink();break;
    case'rules':if(!A.code)saveName();A.rules=b.dataset.g;render();break;
    case'close-rules':A.rules=null;render();break;
    case'set':{const k=b.dataset.k,v=b.dataset.v;A.impSet[k]=k==='hint'?v==='true':+v;render();break}
    case'start-range':run(startRange());break;
    case'start-imp':run(startImp());break;
    case'lobby':run(backToLobby());break;
    case'range-next':run(rangeNext());break;
    case'force-reveal':if(isHost()&&A.hostdata)hostAct('rr-'+s.round,()=>resolveRange());break;
    case'boost':{keepDraft();const k=b.dataset.k;A.draft.boost=A.draft.boost===k?null:k;A.draft.target=A.draft.a=A.draft.b=null;A.err='';render();break}
    case'pt':keepDraft();A.draft.target=b.dataset.p;render();break;
    case'ps':{keepDraft();const p=b.dataset.p,d=A.draft;if(d.a===p)d.a=null;else if(d.b===p)d.b=null;else if(!d.a)d.a=p;else if(!d.b)d.b=p;else{d.a=d.b;d.b=p}render();break}
    case'submit-range':run(submitRange());break;
    case'peek':A.peek=!A.peek;render();break;
    case'seen':A.peek=false;run(A.db.set(P('inputs/'+A.uid),{gid:s.gid,seen:true}));render();break;
    case'force-discuss':hostAct('disc-'+s.gid,()=>startDiscuss());break;
    case'add30':run(A.db.update(P('state'),{endsAt:Math.max(s.endsAt,A.db.now())+30000}));break;
    case'vote-now':hostAct(`vote-${s.gid}-${s.round}`,()=>run(A.db.update(P('state'),{phase:'vote',voted:null})));break;
    case'vote':run(A.db.set(P('inputs/'+A.uid),{gid:s.gid,vround:s.round,vote:b.dataset.p}));break;
  }
});
app.addEventListener('change',e=>{if(e.target.id==='cat')A.impSet.cat=e.target.value});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='code')joinRoom();else if(id==='lo'||id==='hi')submitRange()});
boot();

</script>
</body>
</html>
